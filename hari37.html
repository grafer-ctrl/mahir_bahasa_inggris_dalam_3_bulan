<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Latihan Aktif Inggris</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #007bff;
            --yellow-main: #ffeb3b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }

        body, html {
            height: 100%;
            width: 100%;
            overflow: hidden; /* Anti Scroll */
            background-color: #fff;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
        }

        /* --- SCREEN 1: INTRO --- */
        #intro-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 100%;
        }

        .title-blue {
            color: var(--primary-blue);
            font-weight: 900;
            font-size: 24px;
            margin-bottom: 30px;
            text-transform: uppercase;
        }

        .setting-label { font-weight: 800; font-size: 18px; margin-bottom: 5px; color: #333; }

        .slider-container { margin-bottom: 30px; }

        input[type=range] {
            width: 100%; -webkit-appearance: none; height: 8px;
            background: #ddd; border-radius: 5px; outline: none;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; width: 22px; height: 22px;
            background: var(--primary-blue); border-radius: 50%; cursor: pointer;
        }

        .slider-labels { display: flex; justify-content: space-between; font-weight: 800; font-size: 14px; margin-top: 8px; color: #666; }

        .btn-start {
            background: var(--primary-blue); color: white; border: none;
            padding: 18px; border-radius: 12px; font-weight: 900; font-size: 18px; cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,123,255,0.3);
        }

        /* --- SCREEN 2: SOAL --- */
        #soal-screen { display: none; height: 100%; flex-direction: column; }

        .top-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .timer-container {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .timer-display {
            background: #e0e0e0;
            padding: 10px;
            border-radius: 8px;
            font-weight: 900;
            font-size: 22px;
            min-width: 60px;
            text-align: center;
        }

        .counter-display {
            background: #333;
            color: white;
            padding: 10px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 18px;
            min-width: 55px;
            text-align: center;
        }

        .instruction-blink {
            background: var(--yellow-main);
            color: #ff0000;
            padding: 10px;
            border-radius: 5px;
            font-weight: 900;
            font-size: 11px;
            flex-grow: 1;
            text-align: center;
            animation: blink 0.8s infinite;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1.2;
        }

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }

        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 10px;
            text-align: center;
            overflow-y: auto; /* Untuk penjelasan panjang */
        }

        .soal-text { font-size: 22px; font-weight: 800; margin-bottom: 20px; color: #222; }

        #answer-section { display: none; width: 100%; animation: fadeIn 0.4s ease-in; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .answer-en { font-size: 21px; font-weight: 900; color: var(--primary-blue); margin-bottom: 5px; cursor: pointer; }

        .phonetic { font-size: 17px; font-weight: 700; margin-bottom: 12px; color: #555; font-style: italic; }

        .explanation {
            font-size: 13px; text-align: left; background: #f8f9fa;
            padding: 15px; border-radius: 10px; border-left: 5px solid var(--primary-blue); line-height: 1.5; color: #333;
        }

        /* --- NAVIGASI --- */
        .bottom-nav {
            display: flex;
            gap: 8px;
            margin-bottom: 20px; /* Jarak dari bawah disesuaikan agar pas di HP */
            padding-top: 10px;
        }

        .btn-action {
            background: var(--primary-blue); color: white; border: none;
            padding: 12px; border-radius: 8px; font-weight: 800; cursor: pointer;
            text-decoration: none; display: flex; align-items: center; justify-content: center;
        }

        .btn-lihat { flex: 2; font-size: 16px; background: #28a745; }
        .nav-group { display: flex; gap: 5px; flex: 2; }
        .btn-nav { flex: 1; font-size: 13px; background: #6c757d; }
        .btn-home { background: #333; flex: 0.6; font-size: 18px; }

    </style>
</head>
<body>

<div class="container">
    
    <!-- LAYAR PENGATURAN -->
    <div id="intro-screen">
        <h1 class="title-blue">Latihan Aktif Berbicara Inggris</h1>
        <div class="slider-container">
            <p class="setting-label">Volume Suara</p>
            <input type="range" id="vol-slider" min="0" max="100" value="80">
            <div class="slider-labels"><span>Pelan</span><span>Keras</span></div>
        </div>
        <div class="slider-container">
            <p class="setting-label">Batas Waktu Berpikir</p>
            <input type="range" id="time-slider" min="5" max="60" value="15">
            <div class="slider-labels"><span>5s</span><span>60s</span></div>
        </div>
        <button class="btn-start" onclick="mulaiLatihan()">MULAI LATIHAN</button>
    </div>

    <!-- LAYAR SOAL -->
    <div id="soal-screen">
        <div class="top-bar">
            <div class="timer-container">
                <div class="timer-display" id="timer">00</div>
                <div class="counter-display" id="counter">1/1</div>
            </div>
            <div class="instruction-blink">TERJEMAHKAN & UCAPKAN SEBELUM WAKTU HABIS!</div>
        </div>

        <div class="main-content">
            <div style="font-size: 40px; margin-bottom: 10px;">💬</div>
            <div class="soal-text" id="teks-soal">...</div>

            <div id="answer-section">
                <div class="answer-en" id="teks-inggris" onclick="suaraInggris()">...</div>
                <div class="phonetic" id="teks-phonetic">...</div>
                <div class="explanation" id="teks-penjelasan">...</div>
            </div>
        </div>

        <div class="bottom-nav">
            <button class="btn-action btn-lihat" onclick="tampilJawaban()">LIHAT JAWABAN</button>
            <div class="nav-group">
                <button class="btn-action btn-home" onclick="location.reload()">🏠</button>
                <button class="btn-action btn-nav" onclick="prevSoal()">PREV</button>
                <button class="btn-action btn-nav" onclick="nextSoal()">NEXT</button>
            </div>
        </div>
    </div>
</div>

<script>

        { indo: "Kamu sering ke sini?", eng: "Do you come here often?", phonetic: "(Du yu kam hir of-ten)", expl: "Kebiasaan (often) + menggunakan 'Do' untuk bertanya. " + ketUmum },

        { indo: "Kamu suka ngobrol sama orang baru?", eng: "Do you like talking to new people?", phonetic: "(Du yu laik tok-ing tu nyu pi-pol)", expl: "Kebiasaan sosial. " + ketUmum },

        { indo: "Kamu ngerti aku ngomong apa?", eng: "Do you understand what I say?", phonetic: "(Du yu an-der-stand wot ai sei)", expl: "Kemampuan memahami saat ini. " + ketUmum },
        { indo: "Kamu suka musik apa?", eng: "What music do you like?", phonetic: "(Wot miu-zik du yu laik)", expl: "Preferensi musik. " + ketUmum },
        { indo: "Kamu main TikTok juga?", eng: "Do you use TikTok too?", phonetic: "(Du yu yuz tik-tok tu)", expl: "Kebiasaan sosial media. " + ketUmum },
        { indo: "Kamu orangnya pemalu?", eng: "Are you shy?", phonetic: "(Ar yu shai)", expl: "Menanyakan sifat menggunakan 'To Be'. " + ketUmum },
        { indo: "Kamu sering ketawa sendiri?", eng: "Do you laugh a lot?", phonetic: "(Du yu laf a lot)", expl: "Kebiasaan/sifat. " + ketUmum },
        { indo: "Kamu suka kopi atau teh?", eng: "Do you like coffee or tea?", phonetic: "(Du yu laik ko-fi or ti)", expl: "Pilihan/preferensi. " + ketUmum },
        { indo: "Kamu punya hobi unik?", eng: "Do you have a unique hobby?", phonetic: "(Du yu hev a yu-nik ho-bi)", expl: "Kepemilikan fakta. " + ketUmum },
        { indo: "Kamu biasanya tidur jam berapa?", eng: "What time do you usually sleep?", phonetic: "(Wot taim du yu yu-ju-a-li slip)", expl: "Rutinitas (usually). " + ketUmum },
        { indo: "Kamu suka hujan?", eng: "Do you like rain?", phonetic: "(Du yu laik rein)", expl: "Preferensi alam. " + ketUmum },
        { indo: "Kamu sering jalan-jalan?", eng: "Do you go out often?", phonetic: "(Du yu gou aut of-ten)", expl: "Kebiasaan luar rumah. " + ketUmum },
        { indo: "Kamu lagi cari teman ngobrol?", eng: "Do you look for someone to chat with?", phonetic: "(Du yu luk for sam-wan tu chat wid)", expl: "Tujuan umum. " + ketUmum },
        { indo: "Kamu suka begini tiap malam?", eng: "Do you do this every night?", phonetic: "(Du yu du dis ev-ri nait)", expl: "Kebiasaan tiap malam. " + ketUmum },
        { indo: "Kamu lagi bosan ya?", eng: "Are you bored?", phonetic: "(Ar yu bord)", expl: "Keadaan perasaan saat ini pakai 'To Be'. " + ketUmum },
        { indo: "Kamu sering ketemu orang random di sini?", eng: "Do you meet random people here often?", phonetic: "(Du yu mit ran-dom pi-pol hir of-ten)", expl: "Kebiasaan di platform. " + ketUmum },
        { indo: "Kamu suka ngobrol lama?", eng: "Do you like long conversations?", phonetic: "(Du yu laik long kon-ver-sei-shen)", expl: "Preferensi komunikasi. " + ketUmum },
        { indo: "Kamu tipe orang yang serius?", eng: "Are you a serious person?", phonetic: "(Ar yu a si-ri-us per-son)", expl: "Sifat identitas. " + ketUmum },
        { indo: "Kamu sering senyum gitu?", eng: "Do you smile like that often?", phonetic: "(Du yu smail laik det of-ten)", expl: "Kebiasaan ekspresi. " + ketUmum },
        { indo: "Kamu suka orang yang lucu?", eng: "Do you like funny people?", phonetic: "(Du yu laik fa-ni pi-pol)", expl: "Preferensi tipe orang. " + ketUmum },
        { indo: "Kamu biasanya ngobrol berapa lama di sini?", eng: "How long do you chat here usually?", phonetic: "(Hau long du yu chat hir yu-ju-a-li)", expl: "Rutinitas (usually). " + ketUmum },
        { indo: "Kamu suka ngobrol sama orang luar negeri?", eng: "Do you like talking to foreigners?", phonetic: "(Du yu laik tok-ing tu fo-ri-nerz)", expl: "Kebiasaan/minat. " + ketUmum },
        { indo: "Kamu sering pakai kamera atau tidak?", eng: "Do you use the camera or not?", phonetic: "(Du yu yuz de ka-me-ra or not)", expl: "Kebiasaan penggunaan fitur. " + ketUmum },
        { indo: "Kamu orangnya santai ya?", eng: "Are you a chill person?", phonetic: "(Ar yu a cil per-son)", expl: "Sifat/karakter. " + ketUmum },

        { indo: "Kamu sering online jam segini?", eng: "Do you go online at this time often?", phonetic: "(Du yu gou on-lain at dis taim of-ten)", expl: "Kebiasaan waktu online. " + ketUmum },
        { indo: "Kamu suka nonton YouTube?", eng: "Do you watch YouTube?", phonetic: "(Du yu wotch yu-tyub)", expl: "Hobi rutin. " + ketUmum },

        { indo: "Kamu biasanya langsung skip atau ngobrol dulu?", eng: "Do you skip or chat first?", phonetic: "(Du yu skip or chat ferst)", expl: "Kebiasaan interaksi. " + ketUmum },
        { indo: "Kamu suka bercanda atau serius?", eng: "Do you joke or stay serious?", phonetic: "(Du yu jouk or stei si-ri-us)", expl: "Sifat/kebiasaan. " + ketUmum },
        { indo: "Kamu sering ketemu orang Indonesia di sini?", eng: "Do you meet Indonesians here often?", phonetic: "(Du yu mit in-do-ne-sianz hir of-ten)", expl: "Fakta kebiasaan. " + ketUmum },
        { indo: "Kamu lebih suka chat atau call?", eng: "Do you prefer chatting or calling?", phonetic: "(Du yu pri-fer chat-ing or kol-ing)", expl: "Preferensi komunikasi. " + ketUmum },
        { indo: "Kamu suka ngobrol malam atau siang?", eng: "Do you like chatting at night or day?", phonetic: "(Du yu laik chat-ing at nait or dei)", expl: "Preferensi waktu. " + ketUmum },
        { indo: "Kamu cari teman atau cuma iseng?", eng: "Do you look for friends or just for fun?", phonetic: "(Du yu luk for frends or just for fan)", expl: "Tujuan umum saat ini. " + ketUmum }
    ];

    let currentIndex = 0;
    let timerInterval;
    let waktuSisa;
    let waktuAwal;
    let volumeLevel = 0.8;

    function mulaiLatihan() {
        waktuAwal = parseInt(document.getElementById('time-slider').value);
        volumeLevel = document.getElementById('vol-slider').value / 100;

        document.getElementById('intro-screen').style.display = 'none';
        document.getElementById('soal-screen').style.display = 'flex';

        loadSoal();
    }

    function loadSoal() {
        clearInterval(timerInterval);
        waktuSisa = waktuAwal;
        
        const data = daftarSoal[currentIndex];
        document.getElementById('teks-soal').innerText = data.indo;
        document.getElementById('teks-inggris').innerText = data.eng + " 🔊";
        document.getElementById('teks-phonetic').innerText = data.phonetic;
        document.getElementById('teks-penjelasan').innerHTML = `<strong>Penjelasan:</strong><br>${data.expl}`;
        
        document.getElementById('counter').innerText = `${currentIndex + 1}/${daftarSoal.length}`;
        document.getElementById('answer-section').style.display = 'none';

        startTimer();
        setTimeout(suaraIndo, 400);
    }

    function startTimer() {
        updateTimerDisplay();
        timerInterval = setInterval(() => {
            waktuSisa--;
            updateTimerDisplay();
            if (waktuSisa <= 0) {
                clearInterval(timerInterval);
                tampilJawaban();
            }
        }, 1000);
    }

    function updateTimerDisplay() {
        const timerEl = document.getElementById('timer');
        timerEl.innerText = waktuSisa < 10 ? '0' + waktuSisa : waktuSisa;
        timerEl.style.color = waktuSisa <= 5 ? 'red' : 'black';
    }

    function tampilJawaban() {
        clearInterval(timerInterval);
        document.getElementById('answer-section').style.display = 'block';
        suaraInggris();
    }

    function nextSoal() {
        if (currentIndex < daftarSoal.length - 1) {
            currentIndex++;
            loadSoal();
        } else {
            alert("Hebat! Anda telah menyelesaikan semua latihan.");
            location.reload();
        }
    }

    function prevSoal() {
        if (currentIndex > 0) {
            currentIndex--;
            loadSoal();
        }
    }

    function suaraIndo() {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(daftarSoal[currentIndex].indo);
        msg.lang = 'id-ID';
        msg.volume = volumeLevel;
        window.speechSynthesis.speak(msg);
    }

    function suaraInggris() {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(daftarSoal[currentIndex].eng);
        msg.lang = 'en-US';
        msg.volume = volumeLevel;
        msg.rate = 0.9;
        window.speechSynthesis.speak(msg);
    }
</script>

</body>
</html>
