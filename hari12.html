<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pelatihan Aktif Berbicara - 100 Materi</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #ffffff; }
        .pink-btn { background-color: #e9337c; color: white; transition: all 0.2s; }
        .pink-btn:active { transform: scale(0.95); background-color: #c42664; }
        .blue-box { background-color: #89b0f8; border-radius: 12px; }
        .slider-pink { 
            accent-color: #ff0066; 
            width: 100%;
            height: 10px;
        }
        .hidden-answer { display: none; }
        .fade-in { animation: fadeIn 0.4s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <!-- SCREEN A: INTRO & SETTINGS -->
    <div id="screen-intro" class="max-w-md mx-auto p-6 flex flex-col items-center min-h-screen">
        <h1 class="text-3xl font-bold text-center mt-10">PELATIHAN<br>AKTIF BERBICARA TANPA MIKIR</h1>
        
        <div class="blue-box p-6 mt-8 mb-8 text-center text-lg leading-tight text-white font-medium shadow-lg">
            Jawab langsung secara lisan, jangan ragu.<br>Kamu pasti cepat bisa bahasa Inggris. JAWAB SAJA DENGAN BAHASA INGGRIS
        </div>

        <!-- Settings -->
        <div class="w-full space-y-6 bg-gray-50 p-6 rounded-2xl border border-gray-200 shadow-sm">
            <div>
                <label class="block font-bold mb-2 text-gray-700">Volume Suara</label>
                <input type="range" id="vol-setting" min="0" max="1" step="0.1" value="1" class="slider-pink">
            </div>
            <div>
                <label class="block font-bold mb-2 text-gray-700">Kecepatan Suara</label>
                <input type="range" id="rate-setting" min="0.5" max="1.5" step="0.1" value="0.9" class="slider-pink">
            </div>
            <div>
                <label class="block font-bold mb-2 text-gray-700">Jeda Kunci Jawaban (detik)</label>
                <!-- Set value ke 120 dan max disesuaikan ke 180 agar leluasa -->
                <input type="range" id="timer-setting" min="1" max="180" step="1" value="120" class="slider-pink">
                <p class="text-xs text-right text-gray-500 font-bold mt-1"><span id="timer-val">120</span> Detik</p>
            </div>
        </div>

        <button onclick="startApp()" class="mt-10 flex flex-col items-center group">
            <div class="bg-red-600 w-20 h-20 rounded-full flex items-center justify-center shadow-xl group-hover:bg-red-700 transition transform group-hover:scale-110">
                <i class="fas fa-play text-3xl text-white ml-1"></i>
            </div>
            <span class="text-2xl font-black mt-3 text-gray-800 tracking-widest">MULAI</span>
        </button>
    </div>

    <!-- SCREEN B: PELATIHAN -->
    <div id="screen-quiz" class="hidden max-w-md mx-auto min-h-screen flex flex-col bg-white">
        <!-- Header -->
        <header class="flex items-center justify-between p-4 border-b bg-white sticky top-0 z-10">
            <button onclick="goBack()" class="text-2xl text-gray-400 hover:text-black">
                <i class="fas fa-home"></i>
            </button>
            <h2 class="text-xl font-bold">PELATIHAN</h2>
            <div class="text-sm font-bold bg-blue-100 text-blue-700 px-3 py-1 rounded-full" id="quiz-counter">1/100</div>
        </header>

        <main class="flex-grow p-6 flex flex-col items-center text-center">
            <p class="text-sm font-bold mb-6 uppercase tracking-widest text-gray-400">Jawab Secara Lisan Sekarang</p>

            <!-- Question Box -->
            <div class="blue-box w-full p-6 mb-8 flex justify-between items-center shadow-md text-white">
                <span id="question-text" class="text-xl font-bold text-left leading-tight">...</span>
                <button onclick="speakText('id')" class="ml-4 hover:scale-110 transition"><i class="fas fa-volume-up text-3xl"></i></button>
            </div>

            <p class="mb-3 font-bold text-gray-400 uppercase text-xs tracking-tighter">Lihat jawaban</p>
            
            <!-- Answer Box -->
            <div id="answer-container" class="w-full">
                <!-- Tombol lampu -->
                <button id="btn-reveal" onclick="revealAnswer()" class="blue-box w-full py-8 text-white text-4xl mb-4 shadow-md hover:bg-blue-500 transition">
                    <i class="far fa-lightbulb"></i>
                </button>

                <!-- Isi Jawaban -->
                <div id="answer-content" class="hidden-answer blue-box w-full p-6 text-left shadow-inner fade-in">
                    <div class="flex justify-between items-start mb-2">
                        <div class="flex-1">
                            <p id="en-text" class="text-2xl font-black text-gray-900 leading-tight">...</p>
                            <p id="ph-text" class="text-lg italic text-blue-800 mt-2 font-medium">...</p>
                        </div>
                        <button onclick="speakText('en')" class="bg-white p-3 rounded-full shadow-md hover:scale-110 transition ml-2">
                            <i class="fas fa-volume-up text-blue-500 text-xl"></i>
                        </button>
                    </div>
                    <div id="reason-text" class="text-[11px] mt-4 border-t border-blue-300 pt-3 font-bold uppercase text-blue-900 leading-relaxed opacity-80">
                        ...
                    </div>
                </div>
            </div>
        </main>

        <!-- Footer Navigation -->
        <footer class="p-6 flex justify-between gap-4 bg-gray-50 border-t">
            <button onclick="prevQuiz()" class="pink-btn flex-1 py-4 rounded-2xl font-bold text-lg shadow-md uppercase tracking-wider">Prev</button>
            <button onclick="nextQuiz()" class="pink-btn flex-1 py-4 rounded-2xl font-bold text-lg shadow-md uppercase tracking-wider">Next</button>
        </footer>
    </div>

            { id: "Kamu sering minum kopi", en: "Do you drink coffee often", ph: "Du yu dringk ko-fi of-ten", reason: "ALASAN: Menggunakan Simple Present" },
            { id: "Kamu biasanya santai bagaimana", en: "How do you usually relax", ph: "Hau du yu yu-ju-a-li ri-laks", reason: "ALASAN: Menggunakan Simple Present" },
            { id: "Kamu sibuk setiap hari", en: "Are you busy every day", ph: "Ar yu bi-zi ev-ri dei", reason: "ALASAN: Menggunakan to be (are)" },
            { id: "Kamu suka hari sibuk atau santai", en: "Do you prefer busy or relaxed days", ph: "Du yu pre-fer bi-zi or ri-lakst deiz", reason: "ALASAN: Menggunakan prefer" },
            { id: "Kamu menikmati rutinitasmu", en: "Do you enjoy your daily routine", ph: "Du yu en-joy yor dei-li ru-tin", reason: "ALASAN: Menggunakan Simple Present" }
        ];

        let currentIndex = 0;
        let config = { volume: 1, rate: 0.9, delay: 120000 };
        let autoRevealTimer;

        // Update display detik saat slider digeser
        document.getElementById('timer-setting').oninput = function() {
            document.getElementById('timer-val').innerText = this.value;
        }

        function startApp() {
            config.volume = parseFloat(document.getElementById('vol-setting').value);
            config.rate = parseFloat(document.getElementById('rate-setting').value);
            config.delay = parseInt(document.getElementById('timer-setting').value) * 1000;

            document.getElementById('screen-intro').classList.add('hidden');
            document.getElementById('screen-quiz').classList.remove('hidden');

            currentIndex = 0;
            loadQuestion();
        }

        function loadQuestion() {
            const item = quizData[currentIndex];
            
            // Update UI
            document.getElementById('quiz-counter').innerText = `${currentIndex + 1}/${quizData.length}`;
            document.getElementById('question-text').innerText = item.id;
            document.getElementById('en-text').innerText = item.en;
            document.getElementById('ph-text').innerText = item.ph;
            document.getElementById('reason-text').innerText = item.reason;

            // Reset UI Jawaban
            document.getElementById('answer-content').classList.add('hidden-answer');
            document.getElementById('btn-reveal').classList.remove('hidden');
            
            // Auto-suara Pertanyaan
            window.speechSynthesis.cancel();
            setTimeout(() => {
                speakText('id');
            }, 500);

            // Set Timer Otomatis Muncul Jawaban
            clearTimeout(autoRevealTimer);
            autoRevealTimer = setTimeout(() => {
                revealAnswer();
            }, config.delay);
        }

        function revealAnswer() {
            clearTimeout(autoRevealTimer);
            document.getElementById('btn-reveal').classList.add('hidden');
            document.getElementById('answer-content').classList.remove('hidden-answer');
            
            // Auto-suara Jawaban
            speakText('en');
        }

        function speakText(lang) {
            const item = quizData[currentIndex];
            const speech = new SpeechSynthesisUtterance();
            
            speech.text = (lang === 'id') ? item.id : item.en;
            speech.lang = (lang === 'id') ? 'id-ID' : 'en-US';
            speech.volume = config.volume;
            speech.rate = config.rate;

            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(speech);
        }

        function nextQuiz() {
            if (currentIndex < quizData.length - 1) {
                currentIndex++;
                loadQuestion();
            } else {
                alert("Luar biasa! Semua 100 materi telah selesai.");
                goBack();
            }
        }

        function prevQuiz() {
            if (currentIndex > 0) {
                currentIndex--;
                loadQuestion();
            }
        }

        function goBack() {
            clearTimeout(autoRevealTimer);
            window.speechSynthesis.cancel();
            document.getElementById('screen-intro').classList.remove('hidden');
            document.getElementById('screen-quiz').classList.add('hidden');
        }
    </script>

</body>
</html>
