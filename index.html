<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Mastery Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #1b5e20;
            --accent: #4caf50;
            --bg-color: #f8faf9;
            --white: #ffffff;
            --text-main: #2c3e50;
            --text-muted: #7f8c8d;
            --shadow: 0 10px 30px rgba(0,0,0,0.08);
            --transition: all 0.3s ease;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg-color); color: var(--text-main); }
        .hidden { display: none !important; }

        /* Loader */
        #loader { position: fixed; inset: 0; background: white; display: flex; justify-content: center; align-items: center; z-index: 9999; }
        .spinner { width: 45px; height: 45px; border: 4px solid #f3f3f3; border-top: 4px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Login Section */
        .auth-wrapper { 
            min-height: 100vh; display: flex; align-items: center; justify-content: center; 
            background: linear-gradient(135deg, #1b5e20 0%, #388e3c 100%); padding: 20px;
        }
        .auth-card { 
            background: var(--white); padding: 40px; border-radius: 25px; 
            box-shadow: var(--shadow); width: 100%; max-width: 400px; text-align: center;
        }
        .form-group { text-align: left; margin-bottom: 20px; }
        .form-group label { font-size: 0.75rem; font-weight: 700; color: var(--primary); display: block; margin-bottom: 8px; letter-spacing: 1px; }
        .form-group input { 
            width: 100%; padding: 15px; border: 2px solid #edf2f0; border-radius: 12px; 
            font-size: 1.1rem; text-align: center; font-weight: 700; letter-spacing: 2px;
        }
        .btn-main { 
            background: var(--primary); color: white; border: none; padding: 15px; 
            border-radius: 12px; cursor: pointer; font-weight: 600; width: 100%; font-size: 1rem;
        }

        /* Dashboard */
        .container { max-width: 1000px; margin: 0 auto; padding: 30px 20px; }
        
        .header-dash { background: white; padding: 20px; border-radius: 20px; box-shadow: var(--shadow); margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .header-actions { display: flex; gap: 10px; }
        .btn-action { padding: 8px 15px; border-radius: 10px; cursor: pointer; font-size: 0.75rem; font-weight: 600; border: 1px solid transparent; transition: var(--transition); }
        .btn-logout { background: #fff1f0; color: #ff4d4f; border-color: #ffa39e; }
        .btn-logout:hover { background: #ff4d4f; color: white; }
        .btn-reset { background: #fffbe6; color: #faad14; border-color: #ffe58f; }
        .btn-reset:hover { background: #faad14; color: white; }

        /* Top Navigation Menu */
        .top-nav { display: flex; gap: 12px; margin-bottom: 25px; flex-wrap: wrap; }
        .nav-btn { 
            background: white; border: 1px solid #edf2f0; padding: 12px 15px; border-radius: 15px; 
            cursor: pointer; font-weight: 600; font-size: 0.8rem; box-shadow: var(--shadow); 
            transition: var(--transition); display: flex; align-items: center; gap: 8px; 
            color: var(--text-main); flex: 1; justify-content: center; min-width: 120px;
        }
        .nav-btn:hover { border-color: var(--primary); color: var(--primary); transform: translateY(-3px); }

        .progress-card { background: linear-gradient(135deg, #1b5e20 0%, #4caf50 100%); color: white; padding: 25px; border-radius: 25px; margin-bottom: 30px; box-shadow: var(--shadow); }
        .bar-bg { background: rgba(255,255,255,0.2); height: 10px; border-radius: 10px; margin: 15px 0; overflow: hidden; }
        #progress-fill { background: white; height: 100%; width: 0%; transition: 0.8s ease; }

        /* Grid */
        .grid-materi { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }
        .day-card { background: white; padding: 20px; border-radius: 20px; text-align: center; cursor: pointer; box-shadow: var(--shadow); transition: var(--transition); border: 2px solid transparent; display: flex; flex-direction: column; justify-content: center; }
        .day-card:hover { transform: translateY(-5px); border-color: #c8e6c9; }
        .day-card.completed { background: #e8f5e9; border-color: var(--primary); }
        .day-card i { font-size: 1.5rem; color: var(--primary); margin-bottom: 12px; }
        .day-card h4 { font-size: 1rem; margin-bottom: 5px; }
        .day-desc { font-size: 0.7rem; color: var(--text-muted); line-height: 1.3; }

        /* Viewer */
        #viewer { position: fixed; inset: 0; background: white; z-index: 1000; display: flex; flex-direction: column; }
        .viewer-nav { padding: 15px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        iframe { flex-grow: 1; border: none; }
        .btn-finish { background: var(--primary); color: white; border: none; padding: 20px; font-weight: 700; cursor: pointer; transition: 0.3s; }
        .btn-finish:hover { background: #144918; }

        #alert-msg { color: #d9534f; font-size: 0.85rem; margin-bottom: 15px; font-weight: 600; display: none; }
    </style>
</head>
<body>

    <div id="loader"><div class="spinner"></div></div>

    <!-- HALAMAN LOGIN -->
    <div id="auth-section" class="auth-wrapper hidden">
        <div class="auth-card">
            <i class="fa-solid fa-shield-halved fa-3x" style="color:var(--primary); margin-bottom:20px;"></i>
            <h2>Akses Premium</h2>
            <p style="color:var(--text-muted); font-size:0.8rem; margin-bottom:25px;">Masukkan kode akses yang telah Anda beli</p>
            
            <div id="alert-msg"></div>

            <form id="login-form">
                <div class="form-group">
                    <label>KODE UNIK</label>
                    <input type="text" id="access-code-input" placeholder="KODE-XXXX" required autocomplete="off">
                </div>
                <button type="submit" class="btn-main">AKTIFKAN KURSUS</button>
            </form>
            <p style="margin-top:20px; font-size:0.7rem; color:#999;">Kode ini akan dikunci pada perangkat ini setelah digunakan.</p>
        </div>
    </div>

    <!-- HALAMAN DASHBOARD -->
    <div id="dashboard-section" class="container hidden">
        <div class="header-dash">
            <div>
                <h2 style="font-size: 1.2rem;">Selamat Belajar!</h2>
                <p id="display-code" style="font-size: 0.8rem; color: var(--accent); font-weight:700;"></p>
            </div>
            <div class="header-actions">
                <button onclick="handleReset()" class="btn-action btn-reset"><i class="fa-solid fa-rotate-right"></i> Reset</button>
                <button onclick="handleLogout()" class="btn-action btn-logout"><i class="fa-solid fa-right-from-bracket"></i> Keluar</button>
            </div>
        </div>

        <!-- NAVIGASI TAMBAHAN -->
        <div class="top-nav">
            <button class="nav-btn" onclick="openPage('guide.html', 'Panduan (Guide)')"><i class="fa-solid fa-book"></i> Guide</button>
            <button class="nav-btn" onclick="openPage('tense.html', 'Rumus Tenses')"><i class="fa-solid fa-clock"></i> Tenses</button>
            <button class="nav-btn" onclick="openPage('tentang.html', 'Tentang Program')"><i class="fa-solid fa-circle-info"></i> Tentang</button>
            <button class="nav-btn" onclick="openPage('contact.html', 'Hubungi Kami')"><i class="fa-solid fa-headset"></i> Contact</button>
        </div>

        <div class="progress-card">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <p style="font-size:0.9rem; font-weight: 500;">Progres Belajar</p>
                <h2 id="progress-text">0%</h2>
            </div>
            <div class="bar-bg"><div id="progress-fill"></div></div>
            <p id="progress-detail" style="font-size:0.8rem;">0/90 Hari selesai</p>
        </div>

        <div class="grid-materi" id="materi-grid"></div>
    </div>

    <!-- VIEWER MATERI -->
    <div id="viewer" class="hidden">
        <div class="viewer-nav">
            <button onclick="closeViewer()" style="border:none; background:none; cursor: pointer; color: var(--text-main);"><i class="fa-solid fa-chevron-left fa-xl"></i></button>
            <h4 id="view-title" style="font-size:0.95rem;">Materi</h4>
            <div style="width:20px;"></div>
        </div>
        <iframe id="content-frame"></iframe>
        <button id="btn-mark-complete" class="btn-finish">SAYA SUDAH MEMPELAJARI INI</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, doc, getDoc, updateDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // ==========================================
        // TEMPEL CONFIG FIREBASE ANDA DI BAWAH INI
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyA0aIG6_HpP_JTrKQPG1mzoAsyu4KotaHk",
            authDomain: "english300-e6dd6.firebaseapp.com",
            projectId: "english300-e6dd6",
            storageBucket: "english300-e6dd6.firebasestorage.app",
            messagingSenderId: "1036309233436",
            appId: "1:1036309233436:web:a43155ff8762f4d66684d9"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let userCode = localStorage.getItem('premium_code');
        let completedDays =[];
        const TOTAL_DAYS = 90; // Diubah jadi 90 Hari

        // ==========================================
        // DESKRIPSI PELATIHAN (BISA ANDA EDIT SENDIRI)
        // ==========================================
        const deskripsiMateri =[
            "Pengenalan Basic",       // Hari 1
            "Penggunaan To Be",       // Hari 2
            "Subject & Pronouns",     // Hari 3
            "Simple Present Tense",   // Hari 4
            "Present Continuous",     // Hari 5
            "Vocabulary: Daily Life", // Hari 6
            "Listening Practice",     // Hari 7
            // Anda bisa tambahkan sampai 90 baris di sini.
            // Jika kosong, sistem otomatis memakai "Materi Pelatihan Hari Ke-X"
        ];

        window.onload = async () => {
            if (userCode) {
                const valid = await validateAndLoad(userCode);
                if (!valid) {
                    localStorage.removeItem('premium_code');
                    showSection('auth');
                }
            } else {
                showSection('auth');
            }
            document.getElementById('loader').classList.add('hidden');
        };

        document.getElementById('login-form').onsubmit = async (e) => {
            e.preventDefault();
            const codeInput = document.getElementById('access-code-input').value.trim().toUpperCase();
            const alertBox = document.getElementById('alert-msg');
            
            document.getElementById('loader').classList.remove('hidden');
            const valid = await validateAndLoad(codeInput);
            
            if (valid) {
                localStorage.setItem('premium_code', codeInput);
                userCode = codeInput;
                alertBox.style.display = 'none';
            } else {
                alertBox.textContent = "KODE TIDAK VALID / SUDAH DIGUNAKAN DI PERANGKAT LAIN";
                alertBox.style.display = 'block';
                document.getElementById('loader').classList.add('hidden');
            }
        };

        async function validateAndLoad(code) {
            try {
                const docRef = doc(db, "accessCodes", code);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists() && docSnap.data().status === "active") {
                    const data = docSnap.data();
                    
                    let deviceId = localStorage.getItem('dev_token');
                    if (!deviceId) {
                        deviceId = 'DEV-' + Math.random().toString(36).substr(2, 9).toUpperCase();
                        localStorage.setItem('dev_token', deviceId);
                    }

                    if (data.lockedDevice && data.lockedDevice !== deviceId) {
                        return false; 
                    }

                    if (!data.lockedDevice) {
                        await updateDoc(docRef, { lockedDevice: deviceId });
                    }

                    completedDays = data.completed ||[];
                    renderDashboard(code);
                    showSection('dashboard');
                    return true;
                }
                return false;
            } catch (err) {
                console.log(err);
                return false;
            }
        }

        function renderDashboard(code) {
            document.getElementById('display-code').textContent = code;
            const grid = document.getElementById('materi-grid');
            grid.innerHTML = '';

            for (let i = 1; i <= TOTAL_DAYS; i++) {
                const isDone = completedDays.includes(i);
                
                // Ambil deskripsi dari Array, jika tidak ada pakai teks default
                const desc = deskripsiMateri[i-1] || `Materi Pelatihan Hari Ke-${i}`;

                const card = document.createElement('div');
                card.className = `day-card ${isDone ? 'completed' : ''}`;
                card.innerHTML = `
                    <i class="fa-solid ${isDone ? 'fa-check-circle' : 'fa-play-circle'}"></i>
                    <h4>Hari ${i}</h4>
                    <p class="day-desc">${desc}</p>
                `;
                card.onclick = () => openViewer(i);
                grid.appendChild(card);
            }

            const pct = Math.round((completedDays.length / TOTAL_DAYS) * 100);
            document.getElementById('progress-fill').style.width = pct + '%';
            document.getElementById('progress-text').textContent = pct + '%';
            document.getElementById('progress-detail').textContent = `${completedDays.length} dari ${TOTAL_DAYS} Hari selesai`;
        }

        let currentDayOpen = 0;

        // FUNGSI BUKA MATERI (HARI X)
        window.openViewer = (day) => {
            currentDayOpen = day;
            document.getElementById('view-title').textContent = "Materi Hari " + day;
            document.getElementById('content-frame').src = `hari${day}.html`;
            
            const btn = document.getElementById('btn-mark-complete');
            btn.style.display = 'block'; // Tampilkan tombol selesai
            btn.disabled = completedDays.includes(day);
            btn.textContent = completedDays.includes(day) ? "MATERI SUDAH SELESAI" : "SAYA SUDAH MEMPELAJARI INI";
            btn.style.opacity = completedDays.includes(day) ? "0.5" : "1";
            
            document.getElementById('viewer').classList.remove('hidden');
        };

        // FUNGSI BUKA MENU KHUSUS (Guide, Contact, dll)
        window.openPage = (url, title) => {
            document.getElementById('view-title').textContent = title;
            document.getElementById('content-frame').src = url;
            
            // Sembunyikan tombol "SAYA SUDAH MEMPELAJARI INI" pada page menu biasa
            document.getElementById('btn-mark-complete').style.display = 'none';
            document.getElementById('viewer').classList.remove('hidden');
        };

        window.closeViewer = () => {
            document.getElementById('viewer').classList.add('hidden');
            document.getElementById('content-frame').src = "";
        };

        document.getElementById('btn-mark-complete').onclick = async () => {
            if (completedDays.includes(currentDayOpen)) return;
            
            document.getElementById('loader').classList.remove('hidden');
            const docRef = doc(db, "accessCodes", userCode);
            await updateDoc(docRef, { completed: arrayUnion(currentDayOpen) });
            
            completedDays.push(currentDayOpen);
            renderDashboard(userCode);
            document.getElementById('loader').classList.add('hidden');
            closeViewer();
        };

        // FUNGSI RESET PROGRES
        window.handleReset = async () => {
            if(confirm("PERINGATAN! Apakah Anda yakin ingin mereset seluruh progres belajar? Hari yang sudah ditandai 'Selesai' akan kembali seperti semula.")) {
                document.getElementById('loader').classList.remove('hidden');
                try {
                    const docRef = doc(db, "accessCodes", userCode);
                    await updateDoc(docRef, { completed:[] }); // Kosongkan Array di Firebase
                    
                    completedDays =[]; // Kosongkan Array di Lokal
                    renderDashboard(userCode);
                } catch(e) {
                    console.error("Error mereset data: ", e);
                    alert("Terjadi kesalahan. Pastikan koneksi internet stabil.");
                }
                document.getElementById('loader').classList.add('hidden');
            }
        };

        window.handleLogout = () => {
            if(confirm("Keluar dari akun? Anda butuh kode akses lagi untuk masuk.")) {
                localStorage.removeItem('premium_code');
                location.reload();
            }
        };

        function showSection(id) {
            document.getElementById('auth-section').classList.toggle('hidden', id !== 'auth');
            document.getElementById('dashboard-section').classList.toggle('hidden', id !== 'dashboard');
        }
    </script>
</body>
</html>
