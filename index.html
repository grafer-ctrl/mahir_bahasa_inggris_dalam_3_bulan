<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Mastery Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #1b5e20;
            --accent: #4caf50;
            --bg-color: #f8faf9;
            --white: #ffffff;
            --text-main: #2c3e50;
            --text-muted: #7f8c8d;
            --shadow: 0 10px 30px rgba(0,0,0,0.08);
            --transition: all 0.3s ease;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg-color); color: var(--text-main); }
        .hidden { display: none !important; }

        /* Loader */
        #loader { position: fixed; inset: 0; background: white; display: flex; justify-content: center; align-items: center; z-index: 9999; }
        .spinner { width: 45px; height: 45px; border: 4px solid #f3f3f3; border-top: 4px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Login Section */
        .auth-wrapper { 
            min-height: 100vh; display: flex; align-items: center; justify-content: center; 
            background: linear-gradient(135deg, #1b5e20 0%, #388e3c 100%); padding: 20px;
        }
        .auth-card { 
            background: var(--white); padding: 40px; border-radius: 25px; 
            box-shadow: var(--shadow); width: 100%; max-width: 400px; text-align: center;
        }
        .form-group { text-align: left; margin-bottom: 20px; }
        .form-group label { font-size: 0.75rem; font-weight: 700; color: var(--primary); display: block; margin-bottom: 8px; letter-spacing: 1px; }
        .form-group input { 
            width: 100%; padding: 15px; border: 2px solid #edf2f0; border-radius: 12px; 
            font-size: 1.1rem; text-align: center; font-weight: 700; letter-spacing: 2px;
        }
        .btn-main { 
            background: var(--primary); color: white; border: none; padding: 15px; 
            border-radius: 12px; cursor: pointer; font-weight: 600; width: 100%; font-size: 1rem;
        }

        /* Dashboard */
        .container { max-width: 1000px; margin: 0 auto; padding: 30px 20px; }
        .header-dash { background: white; padding: 20px; border-radius: 20px; box-shadow: var(--shadow); margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center; }
        .progress-card { background: linear-gradient(135deg, #1b5e20 0%, #4caf50 100%); color: white; padding: 25px; border-radius: 25px; margin-bottom: 30px; }
        .bar-bg { background: rgba(255,255,255,0.2); height: 10px; border-radius: 10px; margin: 15px 0; overflow: hidden; }
        #progress-fill { background: white; height: 100%; width: 0%; transition: 0.8s ease; }

        /* Grid */
        .grid-materi { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; }
        .day-card { background: white; padding: 20px; border-radius: 20px; text-align: center; cursor: pointer; box-shadow: var(--shadow); transition: var(--transition); border: 2px solid transparent; }
        .day-card.completed { background: #e8f5e9; border-color: var(--primary); }
        .day-card i { font-size: 1.2rem; color: var(--primary); margin-bottom: 10px; }

        /* Viewer */
        #viewer { position: fixed; inset: 0; background: white; z-index: 1000; display: flex; flex-direction: column; }
        .viewer-nav { padding: 15px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        iframe { flex-grow: 1; border: none; }
        .btn-finish { background: var(--primary); color: white; border: none; padding: 20px; font-weight: 700; cursor: pointer; }

        #alert-msg { color: #d9534f; font-size: 0.85rem; margin-bottom: 15px; font-weight: 600; display: none; }
    </style>
</head>
<body>

    <div id="loader"><div class="spinner"></div></div>

    <!-- HALAMAN LOGIN -->
    <div id="auth-section" class="auth-wrapper hidden">
        <div class="auth-card">
            <i class="fa-solid fa-shield-halved fa-3x" style="color:var(--primary); margin-bottom:20px;"></i>
            <h2>Akses Premium</h2>
            <p style="color:var(--text-muted); font-size:0.8rem; margin-bottom:25px;">Masukkan kode akses yang telah Anda beli</p>
            
            <div id="alert-msg"></div>

            <form id="login-form">
                <div class="form-group">
                    <label>KODE UNIK</label>
                    <input type="text" id="access-code-input" placeholder="KODE-XXXX" required autocomplete="off">
                </div>
                <button type="submit" class="btn-main">AKTIFKAN KURSUS</button>
            </form>
            <p style="margin-top:20px; font-size:0.7rem; color:#999;">Kode ini akan dikunci pada perangkat ini setelah digunakan.</p>
        </div>
    </div>

    <!-- HALAMAN DASHBOARD -->
    <div id="dashboard-section" class="container hidden">
        <div class="header-dash">
            <div>
                <h2 style="font-size: 1rem;">Selamat Belajar!</h2>
                <p id="display-code" style="font-size: 0.7rem; color: var(--accent); font-weight:700;"></p>
            </div>
            <button onclick="handleLogout()" style="background:#fff1f0; color:#ff4d4f; border:1px solid #ffa39e; padding:5px 12px; border-radius:8px; cursor:pointer; font-size:0.7rem;">Log Out</button>
        </div>

        <div class="progress-card">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <p style="font-size:0.8rem;">Progres Belajar</p>
                <h2 id="progress-text">0%</h2>
            </div>
            <div class="bar-bg"><div id="progress-fill"></div></div>
            <p id="progress-detail" style="font-size:0.7rem;">0/300 Hari selesai</p>
        </div>

        <div class="grid-materi" id="materi-grid"></div>
    </div>

    <!-- VIEWER MATERI -->
    <div id="viewer" class="hidden">
        <div class="viewer-nav">
            <button onclick="closeViewer()" style="border:none; background:none;"><i class="fa-solid fa-chevron-left fa-xl"></i></button>
            <h4 id="view-title" style="font-size:0.9rem;">Materi</h4>
            <div style="width:20px;"></div>
        </div>
        <iframe id="content-frame"></iframe>
        <button id="btn-mark-complete" class="btn-finish">SAYA SUDAH MEMPELAJARI INI</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, doc, getDoc, updateDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // ==========================================
        // TEMPEL CONFIG FIREBASE ANDA DI BAWAH INI
        // ==========================================
        const firebaseConfig = {
        apiKey: "AIzaSyAXqMKiTijgDVRRLntQByppWQCGbmdz04M",
    authDomain: "blockdag-polling.firebaseapp.com",
    databaseURL: "https://blockdag-polling-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "blockdag-polling",
    storageBucket: "blockdag-polling.firebasestorage.app",
    messagingSenderId: "458807719521",
    appId: "1:458807719521:web:48f5f49f3e11ca16e45c20"

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let userCode = localStorage.getItem('premium_code');
        let completedDays = [];

        window.onload = async () => {
            if (userCode) {
                const valid = await validateAndLoad(userCode);
                if (!valid) {
                    localStorage.removeItem('premium_code');
                    showSection('auth');
                }
            } else {
                showSection('auth');
            }
            document.getElementById('loader').classList.add('hidden');
        };

        document.getElementById('login-form').onsubmit = async (e) => {
            e.preventDefault();
            const codeInput = document.getElementById('access-code-input').value.trim().toUpperCase();
            const alertBox = document.getElementById('alert-msg');
            
            document.getElementById('loader').classList.remove('hidden');
            const valid = await validateAndLoad(codeInput);
            
            if (valid) {
                localStorage.setItem('premium_code', codeInput);
                userCode = codeInput;
                alertBox.style.display = 'none';
            } else {
                alertBox.textContent = "KODE TIDAK VALID / SUDAH DIGUNAKAN DI PERANGKAT LAIN";
                alertBox.style.display = 'block';
                document.getElementById('loader').classList.add('hidden');
            }
        };

        async function validateAndLoad(code) {
            try {
                const docRef = doc(db, "accessCodes", code);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists() && docSnap.data().status === "active") {
                    const data = docSnap.data();
                    
                    // FUNGSI DEVICE LOCK:
                    // Menciptakan ID unik untuk browser ini
                    let deviceId = localStorage.getItem('dev_token');
                    if (!deviceId) {
                        deviceId = 'DEV-' + Math.random().toString(36).substr(2, 9).toUpperCase();
                        localStorage.setItem('dev_token', deviceId);
                    }

                    // Cek jika kode sudah terkunci ke device lain
                    if (data.lockedDevice && data.lockedDevice !== deviceId) {
                        return false; 
                    }

                    // Jika belum terkunci, kunci sekarang ke device ini
                    if (!data.lockedDevice) {
                        await updateDoc(docRef, { lockedDevice: deviceId });
                    }

                    completedDays = data.completed || [];
                    renderDashboard(code);
                    showSection('dashboard');
                    return true;
                }
                return false;
            } catch (err) {
                console.log(err);
                return false;
            }
        }

        function renderDashboard(code) {
            document.getElementById('display-code').textContent = code;
            const grid = document.getElementById('materi-grid');
            grid.innerHTML = '';

            for (let i = 1; i <= 300; i++) {
                const isDone = completedDays.includes(i);
                const card = document.createElement('div');
                card.className = `day-card ${isDone ? 'completed' : ''}`;
                card.innerHTML = `<i class="fa-solid ${isDone ? 'fa-check-circle' : 'fa-play-circle'}"></i><h4>Hari ${i}</h4>`;
                card.onclick = () => openViewer(i);
                grid.appendChild(card);
            }

            const pct = Math.round((completedDays.length / 300) * 100);
            document.getElementById('progress-fill').style.width = pct + '%';
            document.getElementById('progress-text').textContent = pct + '%';
            document.getElementById('progress-detail').textContent = `${completedDays.length} dari 300 materi selesai`;
        }

        let currentDayOpen = 0;
        window.openViewer = (day) => {
            currentDayOpen = day;
            document.getElementById('view-title').textContent = "Materi Hari " + day;
            document.getElementById('content-frame').src = `hari${day}.html`;
            document.getElementById('viewer').classList.remove('hidden');
            
            const btn = document.getElementById('btn-mark-complete');
            btn.disabled = completedDays.includes(day);
            btn.textContent = completedDays.includes(day) ? "MATERI SUDAH SELESAI" : "SAYA SUDAH MEMPELAJARI INI";
            btn.style.opacity = completedDays.includes(day) ? "0.5" : "1";
        };

        window.closeViewer = () => {
            document.getElementById('viewer').classList.add('hidden');
            document.getElementById('content-frame').src = "";
        };

        document.getElementById('btn-mark-complete').onclick = async () => {
            if (completedDays.includes(currentDayOpen)) return;
            
            const docRef = doc(db, "accessCodes", userCode);
            await updateDoc(docRef, { completed: arrayUnion(currentDayOpen) });
            
            completedDays.push(currentDayOpen);
            renderDashboard(userCode);
            closeViewer();
        };

        window.handleLogout = () => {
            if(confirm("Keluar dari akun? Anda butuh kode akses lagi untuk masuk.")) {
                localStorage.removeItem('premium_code');
                location.reload();
            }
        };

        function showSection(id) {
            document.getElementById('auth-section').classList.toggle('hidden', id !== 'auth');
            document.getElementById('dashboard-section').classList.toggle('hidden', id !== 'dashboard');
        }
    </script>
</body>
</html>
