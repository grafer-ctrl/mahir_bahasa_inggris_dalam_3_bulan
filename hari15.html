        { s: "Seratus dolar sama dengan satu juta lima ratus ribu", j: "One hundred dollars equals one million five hundred thousand", p: "Wan han-dred do-larz i-kwals wan mil-yon faiv han-dred tau-zend", k: "⚖️ Konversi mata uang." },
        { s: "Gaji saya lima juta per bulan", j: "My salary is five million per month", p: "Mai sa-la-ri iz faiv mil-yon per manth", k: "💼 Gaji bulanan." },
        { s: "Saya menabung dua ratus ribu per minggu", j: "I save two hundred thousand per week", p: "Ai seiv tu han-dred tau-zend per wik", k: "🏦 Menabung rutin." },
        { s: "Total pengeluaran satu juta", j: "The total expense is one million", p: "De to-tal eks-pens iz wan mil-yon", k: "🧾 Pengeluaran." },
        { s: "Harga naik dari seratus ke seratus lima puluh", j: "The price goes from one hundred to one hundred fifty", p: "De prais goz from wan han-dred tu wan han-dred fif-ti", k: "📈 from ... to ... (kenaikan)." },
        { s: "Harga turun dari dua ratus ke seratus", j: "The price drops from two hundred to one hundred", p: "De prais drops from tu han-dred tu wan han-dred", k: "📉 Penurunan harga." },
        { s: "Saya butuh seribu dolar", j: "I need one thousand dollars", p: "Ai nid wan tau-zend do-larz", k: "💸 Kebutuhan finansial." },
        { s: "Dia membayar dua ratus dolar", j: "He pays two hundred dollars", p: "Hi peiz tu han-dred do-larz", k: "💵 Membayar (verb+s)." },
        { s: "Kami menghabiskan satu juta hari ini", j: "We spend one million today", p: "Wi spend wan mil-yon tu-dei", k: "🛒 Spend → belanja." },
        { s: "Seratus ribu ditambah lima puluh ribu sama dengan seratus lima puluh ribu", j: "One hundred thousand plus fifty thousand equals one hundred fifty thousand", p: "Wan han-dred tau-zend plas fif-ti tau-zend i-kwals wan han-dred fif-ti tau-zend", k: "➕ Penjumlahan besar." },
        { s: "Dua juta dikurangi lima ratus ribu sama dengan satu juta lima ratus ribu", j: "Two million minus five hundred thousand equals one million five hundred thousand", p: "Tu mil-yon mai-nas faiv han-dred tau-zend i-kwals wan mil-yon faiv han-dred tau-zend", k: "➖ Pengurangan nominal." },
        { s: "Sepuluh ribu dikali sepuluh sama dengan seratus ribu", j: "Ten thousand times ten equals one hundred thousand", p: "Ten tau-zend taims ten i-kwals wan han-dred tau-zend", k: "✖️ Perkalian keuangan." },
        { s: "Seratus ribu dibagi dua sama dengan lima puluh ribu", j: "One hundred thousand divided by two equals fifty thousand", p: "Wan han-dred tau-zend di-vai-ded bai tu i-kwals fif-ti tau-zend", k: "➗ Pembagian nominal." },
        { s: "Sepuluh persen dari satu juta adalah seratus ribu", j: "Ten percent of one million is one hundred thousand", p: "Ten per-sent of wan mil-yon iz wan han-dred tau-zend", k: "📊 Persen dari jutaan." },
        { s: "Dua puluh persen dari lima juta adalah satu juta", j: "Twenty percent of five million is one million", p: "Twen-ti per-sent of faiv mil-yon iz wan mil-yon", k: "📈 20% profit." },
        { s: "Tiga puluh persen dari seratus ribu adalah tiga puluh ribu", j: "Thirty percent of one hundred thousand is thirty thousand", p: "Ther-ti per-sent of wan han-dred tau-zend iz ther-ti tau-zend", k: "🧮 Persen transaksi." },
        { s: "Harga sekarang dua ratus ribu", j: "The price is now two hundred thousand", p: "De prais iz nau tu han-dred tau-zend", k: "🏷️ Harga saat ini." },
        { s: "Harga sebelumnya seratus lima puluh ribu", j: "The previous price was one hundred fifty thousand", p: "De pri-vi-us prais woz wan han-dred fif-ti tau-zend", k: "⏮️ Previous price (masa lalu)." }
    ];
    // pastikan total 80 soal (jika kurang dari 80, kita duplikasi beberapa agar mencapai 80 untuk demo)
    while(daftarSoal.length < 80) {
        daftarSoal.push({ s: "Dua puluh ditambah tiga puluh sama dengan lima puluh", j: "Twenty plus thirty equals fifty", p: "Twen-ti plas ther-ti i-kwals fif-ti", k: "➕ tambahan latihan angka." });
    }

    let currentIndex = 0;
    let timerExplose;

    const timerRange = document.getElementById('timerRange');
    const timerValDisplay = document.getElementById('timerValDisplay');
    timerRange.addEventListener('input', () => {
        timerValDisplay.innerText = timerRange.value + " detik";
    });
    timerValDisplay.innerText = timerRange.value + " detik";

    function speak(text, lang) {
        window.speechSynthesis.cancel();
        if(!text) return;
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = lang;
        utterance.rate = 0.92;
        utterance.volume = 1;
        window.speechSynthesis.speak(utterance);
    }

    function stopAudio() { 
        window.speechSynthesis.cancel(); 
        clearTimeout(timerExplose);
    }

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(id === 'screen-a') {
            speak("Selamat datang di pelatihan angka dan transaksi. Jangan banyak mikir, yang penting bicara dulu. Targetmu tiga bulan sudah lancar.", 'id-ID');
        }
        if(id === 'screen-c') {
            tampilkanSoal();
        }
    }

    function resetLatihan() {
        currentIndex = 0;
    }

    function tampilkanSoal() {
        clearTimeout(timerExplose);
        const item = daftarSoal[currentIndex];
        document.getElementById('soal-counter').innerText = `Soal ${currentIndex+1} / ${daftarSoal.length}`;
        document.getElementById('soal-teks').innerText = item.s;
        const jawabanDiv = document.getElementById('kunci-jawaban');
        jawabanDiv.style.display = 'none';
        document.getElementById('jawaban-en').innerHTML = item.j;
        document.getElementById('jawaban-pronun').innerText = item.p;
        document.getElementById('jawaban-ket').innerHTML = `📘 ${item.k}`;
        const speakBtn = document.getElementById('speak-btn');
        speakBtn.onclick = () => speak(item.j, 'en-US');
        
        speak(item.s, 'id-ID');
        
        const delay = parseInt(timerRange.value) * 1000;
        timerExplose = setTimeout(() => { tampilJawaban(); }, delay);
    }

    function tampilJawaban() {
        const jawDiv = document.getElementById('kunci-jawaban');
        if(jawDiv) {
            jawDiv.style.display = 'block';
            speak(daftarSoal[currentIndex].j, 'en-US');
        }
    }

    function nextSoal() {
        currentIndex++;
        if(currentIndex >= daftarSoal.length) {
            alert("✨ Selamat! Kamu menyelesaikan semua latihan angka & uang. Mulai dari awal lagi untuk penguatan.");
            currentIndex = 0;
        }
        tampilkanSoal();
    }
</script>
