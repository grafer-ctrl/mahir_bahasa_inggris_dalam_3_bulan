<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flashcards Kosakata Seru</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #6366f1;
      --secondary: #10b981;
      --accent: #f59e0b;
      --bg: #0f172a;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: radial-gradient(circle at top left, #1e293b, #0f172a);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      overflow: hidden;
    }

    .container {
      width: 100%;
      max-width: 400px;
      padding: 20px;
    }

    .stats {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 14px;
      font-weight: 600;
      color: #94a3b8;
    }

    .progress-bar {
      width: 100%;
      height: 8px;
      background: #334155;
      border-radius: 10px;
      margin-bottom: 25px;
      overflow: hidden;
    }

    #progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #6366f1, #a855f7);
      transition: width 0.3s ease;
    }

    .card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 40px 30px;
      border-radius: 30px;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
      position: relative;
    }

    h1 {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--primary);
      margin-bottom: 30px;
    }

    .word {
      font-size: 42px;
      font-weight: 800;
      margin: 10px 0;
      background: linear-gradient(to right, #fff, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      min-height: 60px;
    }

    .result-box {
      min-height: 80px;
      margin-top: 20px;
      padding: 15px;
      border-radius: 15px;
      background: rgba(0,0,0,0.2);
      opacity: 0;
      transition: 0.3s;
    }

    .result-box.show {
      opacity: 1;
    }

    .arti {
      font-size: 20px;
      color: var(--secondary);
      font-weight: 600;
      display: block;
    }

    .baca {
      font-size: 14px;
      color: #94a3b8;
      font-style: italic;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 30px;
    }

    button {
      padding: 12px;
      border: none;
      border-radius: 15px;
      cursor: pointer;
      font-family: 'Poppins', sans-serif;
      font-weight: 600;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    button:active { transform: scale(0.95); }

    .btn-random { background: var(--primary); color: white; grid-column: span 2; font-size: 18px; }
    .btn-answer { background: rgba(255,255,255,0.1); color: white; }
    .btn-audio { background: var(--accent); color: white; }

    .finished-msg {
      display: none;
      font-size: 18px;
      color: var(--secondary);
    }
  </style>
</head>
<body>

<div class="container">
  <div class="stats">
    <span id="counterText">Progress: 0 / 100</span>
    <span id="percentText">0%</span>
  </div>
  <div class="progress-bar">
    <div id="progress-fill"></div>
  </div>

  <div class="card">
    <h1>English Quiz</h1>
    
    <div id="quiz-content">
      <div class="word" id="word">Ready?</div>
      
      <div class="result-box" id="resultBox">
        <span class="arti" id="arti">---</span>
        <span class="baca" id="baca">---</span>
      </div>

      <div class="controls">
        <button class="btn-random" onclick="acakKata()">Mulai / Acak Kata ➔</button>
        <button class="btn-answer" onclick="lihatJawaban()">💡 Jawaban</button>
        <button class="btn-audio" onclick="playAudio()">🔊 Suara</button>
      </div>
    </div>

    <div id="finished-msg" class="finished-msg">
      <h2>🎉 Hebat!</h2>
      <p>Semua 100 kata telah dipelajari!</p>
      <button class="btn-random" onclick="resetGame()">Ulangi Dari Awal</button>
    </div>
  </div>
</div>

<script>
  const fullData = [
    { word: "Ride", arti: "naik" }, { word: "Rise", arti: "bangkit" }, { word: "Risk", arti: "risiko" },
    { word: "Rock", arti: "batu" }, { word: "Roll", arti: "menggulung" }, { word: "Room", arti: "kamar" },
    { word: "Rule", arti: "aturan" }, { word: "Run", arti: "lari" }, { word: "Safe", arti: "aman" },
    { word: "Same", arti: "sama" }, { word: "Save", arti: "menyimpan" }, { word: "Say", arti: "mengatakan" },
    { word: "Scene", arti: "tempat kejadian" }, { word: "School", arti: "sekolah" }, { word: "Science", arti: "ilmu" },
    { word: "Scientist", arti: "ilmuwan" }, { word: "Score", arti: "skor" }, { word: "Sea", arti: "laut" },
    { word: "Religious", arti: "keagamaan" }, { word: "Remain", arti: "tetap" }, { word: "Remember", arti: "ingat" },
    { word: "Remove", arti: "menghapus" }, { word: "Report", arti: "melapor" }, { word: "Represent", arti: "mewakili" },
    { word: "Road", arti: "jalan" }, { word: "Season", arti: "musim" }, { word: "Seat", arti: "kursi" },
    { word: "Second", arti: "kedua" }, { word: "Section", arti: "bagian" }, { word: "Security", arti: "keamanan" },
    { word: "See", arti: "melihat" }, { word: "Seek", arti: "mencari" }, { word: "Sell", arti: "menjual" },
    { word: "Send", arti: "mengirim" }, { word: "Seven", arti: "tujuh" }, { word: "Several", arti: "beberapa" },
    { word: "Sexual", arti: "seksual" }, { word: "Shake", arti: "menggoyangkan" }, { word: "Share", arti: "membagikan" },
    { word: "She", arti: "dia (p)" }, { word: "Should", arti: "sebaiknya" }, { word: "Short", arti: "pendek" },
    { word: "Senior", arti: "senior" }, { word: "Sense", arti: "merasakan" }, { word: "Serious", arti: "serius" },
    { word: "Serve", arti: "melayani" }, { word: "Service", arti: "layanan" }, { word: "Set", arti: "menetapkan" },
    { word: "Shoot", arti: "menembak" }, { word: "Shoulder", arti: "bahu" }, { word: "Show", arti: "menunjukkan" },
    { word: "Side", arti: "sisi" }, { word: "Significant", arti: "signifikan" }, { word: "Someone", arti: "seseorang" },
    { word: "Something", arti: "sesuatu" }, { word: "Sometimes", arti: "terkadang" }, { word: "Sun", arti: "matahari" },
    { word: "Song", arti: "lagu" }, { word: "Soon", arti: "segera" }, { word: "Sort", arti: "menyortir" },
    { word: "Sound", arti: "suara" }, { word: "Source", arti: "sumber" }, { word: "South", arti: "selatan" },
    { word: "So much", arti: "sangat banyak" }, { word: "Space", arti: "ruang" }, { word: "Speak", arti: "berbicara" },
    { word: "Special", arti: "khusus" }, { word: "Specific", arti: "spesifik" }, { word: "Speech", arti: "pidato" },
    { word: "Spend", arti: "menghabiskan" }, { word: "Six", arti: "enam" }, { word: "Size", arti: "ukuran" },
    { word: "Skill", arti: "keterampilan" }, { word: "Skin", arti: "kulit" }, { word: "Small", arti: "kecil" },
    { word: "Smile", arti: "tersenyum" }, { word: "Social", arti: "sosial" }, { word: "Society", arti: "masyarakat" },
    { word: "Soldier", arti: "tentara" }, { word: "Some", arti: "beberapa" }, { word: "Somebody", arti: "seseorang" },
    { word: "Similar", arti: "serupa" }, { word: "Simple", arti: "sederhana" }, { word: "Simply", arti: "secara sederhana" },
    { word: "Since", arti: "sejak" }, { word: "Sing", arti: "bernyanyi" }, { word: "Single", arti: "tunggal" },
    { word: "Sister", arti: "saudari" }, { word: "Sit", arti: "duduk" }, { word: "Sight", arti: "penglihatan" },
    { word: "Situation", arti: "situasi" }
  ];

  let availableWords = [...fullData];
  let currentWord = null;
  let masteredCount = 0;

  function updateProgress() {
    masteredCount = fullData.length - availableWords.length;
    const percent = Math.floor((masteredCount / fullData.length) * 100);
    document.getElementById("counterText").innerText = `Progress: ${masteredCount} / ${fullData.length}`;
    document.getElementById("percentText").innerText = `${percent}%`;
    document.getElementById("progress-fill").style.width = `${percent}%`;
  }

  function acakKata() {
    if (availableWords.length === 0) {
      document.getElementById("quiz-content").style.display = "none";
      document.getElementById("finished-msg").style.display = "block";
      return;
    }

    const randomIndex = Math.floor(Math.random() * availableWords.length);
    currentWord = availableWords[randomIndex];
    
    // Hapus dari antrian agar tidak muncul dua kali
    availableWords.splice(randomIndex, 1);

    document.getElementById("word").innerText = currentWord.word;
    document.getElementById("resultBox").classList.remove("show");
    
    updateProgress();
    // Play audio otomatis (opsional)
    // playAudio(); 
  }

  function lihatJawaban() {
    if (!currentWord) return;
    document.getElementById("arti").innerText = currentWord.arti;
    document.getElementById("baca").innerText = "Pronunciation: " + currentWord.word;
    document.getElementById("resultBox").classList.add("show");
  }

  function playAudio() {
    if (!currentWord) return;
    const utterance = new SpeechSynthesisUtterance(currentWord.word);
    utterance.lang = 'en-US';
    utterance.rate = 0.8;
    window.speechSynthesis.speak(utterance);
  }

  function resetGame() {
    availableWords = [...fullData];
    masteredCount = 0;
    document.getElementById("quiz-content").style.display = "block";
    document.getElementById("finished-msg").style.display = "none";
    updateProgress();
    acakKata();
  }
</script>

</body>
</html>
