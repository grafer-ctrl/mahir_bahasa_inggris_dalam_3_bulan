        let currentIndex = 0;
        let timerAnswer;

        function updateVal(id, value) {
            document.getElementById(id).innerText = value;
        }

        function speak(text, lang = 'id-ID') {
            window.speechSynthesis.cancel(); 
            const speed = document.getElementById('speed-voice').value;
            const volume = document.getElementById('volume-voice').value;
            
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = lang;
            utterance.rate = parseFloat(speed);
            utterance.volume = parseFloat(volume);
            window.speechSynthesis.speak(utterance);
        }

        function startApp() {
            document.getElementById('intro-screen').classList.add('hidden');
            document.getElementById('exercise-screen').classList.remove('hidden');
            document.getElementById('nav-controls').classList.remove('hidden');
            loadQuestion();
        }

        function loadQuestion() {
            clearTimeout(timerAnswer);
            
            // UI Reset
            const q = questions[currentIndex];
            document.getElementById('question-text').innerText = q.id;
            document.getElementById('answer-en').innerText = q.en;
            document.getElementById('answer-id').innerText = q.id;
            document.getElementById('answer-phonetic').innerText = q.ph;
            
            document.getElementById('answer-section').classList.add('invisible');
            document.getElementById('answer-section').classList.remove('fade-in');
            document.getElementById('btn-manual-show').classList.remove('hidden');
            
            // Progress
            const progress = ((currentIndex + 1) / questions.length) * 100;
            document.getElementById('top-progress').style.width = progress + '%';
            document.getElementById('progress-text').innerText = `Question ${currentIndex + 1} / ${questions.length}`;

            // Voice Question
            setTimeout(() => speak(q.id, 'id-ID'), 400);

            // Auto Reveal
            const delay = document.getElementById('speed-answer').value;
            timerAnswer = setTimeout(() => {
                showAnswer();
            }, delay * 1000);
        }

        function showAnswer() {
            clearTimeout(timerAnswer);
            const section = document.getElementById('answer-section');
            section.classList.remove('invisible');
            section.classList.add('fade-in');
            document.getElementById('btn-manual-show').classList.add('hidden');
        }

        function playEnglishAudio() {
            speak(questions[currentIndex].en, 'en-US');
        }

        function nextQuestion() {
            if (currentIndex < questions.length - 1) {
                currentIndex++;
                loadQuestion();
            } else {
                alert("Selamat! Anda telah menyelesaikan semua latihan.");
                window.location.href = "index.html";
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                loadQuestion();
            }
