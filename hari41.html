<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Latihan Aktif Inggris - Tense Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #007bff;
            --yellow-main: #ffeb3b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }

        body, html {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #fff;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
        }

        /* --- SCREEN 1: INTRO --- */
        #intro-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 100%;
        }

        .title-blue {
            color: var(--primary-blue);
            font-weight: 900;
            font-size: 24px;
            margin-bottom: 30px;
            text-align: center;
        }

        .setting-label { font-weight: 800; font-size: 20px; margin-bottom: 5px; }

        .slider-container { margin-bottom: 40px; }

        input[type=range] {
            width: 100%; -webkit-appearance: none; height: 8px;
            background: var(--primary-blue); border-radius: 5px; outline: none;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; width: 22px; height: 22px;
            background: var(--primary-blue); border-radius: 50%; cursor: pointer;
        }

        .slider-labels { display: flex; justify-content: space-between; font-weight: 800; font-size: 14px; margin-top: 8px; }

        .btn-start {
            background: var(--primary-blue); color: white; border: none;
            padding: 15px; border-radius: 10px; font-weight: 800; font-size: 18px; cursor: pointer;
        }

        /* --- SCREEN 2: SOAL --- */
        #soal-screen { display: none; height: 100%; flex-direction: column; }

        .top-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .timer-container {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .timer-display {
            background: #e0e0e0;
            padding: 10px;
            border-radius: 8px;
            font-weight: 900;
            font-size: 22px;
            min-width: 60px;
            text-align: center;
        }

        .counter-display {
            background: #333;
            color: white;
            padding: 10px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 18px;
            min-width: 55px;
            text-align: center;
        }

        .instruction-blink {
            background: var(--yellow-main);
            color: #ff0000;
            padding: 10px;
            border-radius: 5px;
            font-weight: 900;
            font-size: 13px;
            flex-grow: 1;
            text-align: center;
            animation: blink 0.8s infinite;
        }

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 10px;
            text-align: center;
            overflow-y: auto;
            padding-bottom: 220px; /* Agar tidak tertutup nav yang dinaikkan */
        }

        .soal-text { font-size: 22px; font-weight: 800; margin-bottom: 20px; color: #222; }

        #answer-section { display: none; width: 100%; animation: fadeIn 0.5s ease-in; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .answer-en { font-size: 20px; font-weight: 900; color: #000; margin-bottom: 5px; cursor: pointer; }

        .phonetic { font-size: 17px; font-weight: 700; margin-bottom: 10px; color: #444; font-style: italic; }

        .explanation {
            font-size: 12px; text-align: left; background: #f1f3ff;
            padding: 12px; border-radius: 10px; border-left: 5px solid var(--primary-blue); line-height: 1.4;
            margin-bottom: 10px;
        }

        /* NOTE KHUSUS */
        .special-note {
            background: #fff3cd;
            color: #856404;
            font-size: 13px;
            font-weight: 800;
            padding: 10px;
            border-radius: 8px;
            border: 1px dashed #ffeeba;
            margin-top: 5px;
        }

        /* --- NAVIGASI DINAIKKAN 150PX --- */
        .bottom-nav {
            position: absolute;
            bottom: 150px; /* Posisi naik 150px dari bawah */
            left: 20px;
            right: 20px;
            display: flex;
            gap: 8px;
            background: white;
            padding-top: 10px;
        }

        .btn-action {
            background: var(--primary-blue); color: white; border: none;
            padding: 12px; border-radius: 8px; font-weight: 800; cursor: pointer;
            text-decoration: none; display: flex; align-items: center; justify-content: center;
        }

        .btn-lihat { flex: 2; font-size: 16px; box-shadow: 0 4px 10px rgba(0,123,255,0.3); }
        .nav-group { display: flex; gap: 5px; flex: 2; }
        .btn-nav { flex: 1; font-size: 13px; }
        .btn-home { background: #333; flex: 0.6; font-size: 18px; }

    </style>
</head>
<body>

<div class="container">
    
    <!-- LAYAR PENGATURAN -->
    <div id="intro-screen">
        <h1 class="title-blue">Latihan Aktif Berbicara:<br>Present Perfect Continuous</h1>
        <div class="slider-container">
            <p class="setting-label">seting volume</p>
            <input type="range" id="vol-slider" min="0" max="200" value="100">
            <div class="slider-labels"><span>0</span><span>200</span></div>
        </div>
        <div class="slider-container">
            <p class="setting-label">seting batas waktu</p>
            <input type="range" id="time-slider" min="0" max="120" value="15">
            <div class="slider-labels"><span>0</span><span>120 s</span></div>
        </div>
        <button class="btn-start" onclick="mulaiLatihan()">MULAI LATIHAN</button>
    </div>

    <!-- LAYAR SOAL -->
    <div id="soal-screen">
        <div class="top-bar">
            <div class="timer-container">
                <div class="timer-display" id="timer">00</div>
                <div class="counter-display" id="counter">1/1</div>
            </div>
            <div class="instruction-blink">Terjemahkan & Ucapkan</div>
        </div>

        <div class="main-content">
            <div style="font-size: 40px; margin-bottom: 10px;">🔊</div>
            <div class="soal-text" id="teks-soal">...</div>

            <div id="answer-section">
                <div class="answer-en" id="teks-inggris" onclick="suaraInggris()">...</div>
                <div class="phonetic" id="teks-phonetic">...</div>
                <div class="explanation" id="teks-penjelasan">...</div>
                <div class="special-note">📌 Sudah mulai dari dulu, dan MASIH berlangsung sampai sekarang.</div>
            </div>
        </div>

        <div class="bottom-nav">
            <button class="btn-action btn-lihat" onclick="tampilJawaban()">lihat Jawaban</button>
            <div class="nav-group">
                <a href="#" class="btn-action btn-home" onclick="location.reload()">🏠</a>
                <button class="btn-action btn-nav" onclick="prevSoal()">prev</button>
                <button class="btn-action btn-nav" onclick="nextSoal()">nex</button>
            </div>
        </div>
    </div>
</div>

        { indo: "Aku sudah menjaga kesehatan akhir-akhir ini", eng: "I have been taking care of my health lately", phonetic: "Ai hev bin tei-king ker ov mai helth leit-li", expl: "Alasan: Perubahan gaya hidup." },
        { indo: "Aku sudah membaca buku ini selama seminggu", eng: "I have been reading this book for a week", phonetic: "Ai hev bin ri-ding dhis buk for a wik", expl: "Alasan: Aktivitas belum selesai." },
        { indo: "Aku sudah belajar dari kesalahan", eng: "I have been learning from my mistakes", phonetic: "Ai hev bin ler-ning from mai mis-teiks", expl: "Alasan: Proses belajar berkelanjutan." },
        { indo: "Aku sudah mencoba jadi lebih baik", eng: "I have been trying to be better", phonetic: "Ai hev bin trai-ing tu bi be-ter", expl: "Alasan: Usaha terus berjalan." },
        { indo: "Aku sudah memperhatikanmu sejak tadi", eng: "I have been noticing you", phonetic: "Ai hev bin no-ti-sing yu", expl: "Alasan: Perhatian yang masih berlangsung." }
    ];

    let currentIndex = 0;
    let timerInterval;
    let waktuSisa;
    let waktuAwal;
    let volumeLevel = 0.5;

    function mulaiLatihan() {
        waktuAwal = parseInt(document.getElementById('time-slider').value);
        volumeLevel = document.getElementById('vol-slider').value / 200;

        document.getElementById('intro-screen').style.display = 'none';
        document.getElementById('soal-screen').style.display = 'flex';

        loadSoal();
    }

    function loadSoal() {
        clearInterval(timerInterval);
        waktuSisa = waktuAwal;
        
        const data = daftarSoal[currentIndex];
        document.getElementById('teks-soal').innerText = data.indo;
        document.getElementById('teks-inggris').innerText = data.eng + " 🔊";
        document.getElementById('teks-phonetic').innerText = data.phonetic;
        document.getElementById('teks-penjelasan').innerHTML = `<strong>Penjelasan:</strong><br>${data.expl}`;
        
        document.getElementById('counter').innerText = `${currentIndex + 1}/${daftarSoal.length}`;
        document.getElementById('answer-section').style.display = 'none';

        startTimer();
        setTimeout(suaraIndo, 500);
    }

    function startTimer() {
        updateTimerDisplay();
        timerInterval = setInterval(() => {
            waktuSisa--;
            updateTimerDisplay();
            if (waktuSisa <= 0) {
                clearInterval(timerInterval);
                tampilJawaban();
            }
        }, 1000);
    }

    function updateTimerDisplay() {
        document.getElementById('timer').innerText = waktuSisa < 10 ? '0' + waktuSisa : waktuSisa;
    }

    function tampilJawaban() {
        clearInterval(timerInterval);
        document.getElementById('answer-section').style.display = 'block';
        suaraInggris();
    }

    function nextSoal() {
        if (currentIndex < daftarSoal.length - 1) {
            currentIndex++;
            loadSoal();
        } else {
            alert("Latihan Selesai!");
        }
    }

    function prevSoal() {
        if (currentIndex > 0) {
            currentIndex--;
            loadSoal();
        }
    }

    function suaraIndo() {
        const msg = new SpeechSynthesisUtterance(daftarSoal[currentIndex].indo);
        msg.lang = 'id-ID';
        msg.volume = volumeLevel;
        window.speechSynthesis.speak(msg);
    }

    function suaraInggris() {
        const msg = new SpeechSynthesisUtterance(daftarSoal[currentIndex].eng);
        msg.lang = 'en-US';
        msg.volume = volumeLevel;
        window.speechSynthesis.speak(msg);
    }
</script>
