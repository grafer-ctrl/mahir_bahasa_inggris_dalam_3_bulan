<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">

    <title>Latihan Aktif Inggris</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #007bff;
            --yellow-main: #ffeb3b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }

        body, html {
            height: 100%;
            width: 100%;
            overflow: hidden; /* Anti Scroll */
            background-color: #fff;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
        }

        /* --- SCREEN 1: INTRO --- */
        #intro-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 100%;
        }

        .title-blue {
            color: var(--primary-blue);
            font-weight: 900;
            font-size: 24px;
            margin-bottom: 30px;
        }

        .setting-label { font-weight: 800; font-size: 20px; margin-bottom: 5px; }

        .slider-container { margin-bottom: 40px; }

        input[type=range] {
            width: 100%; -webkit-appearance: none; height: 8px;
            background: var(--primary-blue); border-radius: 5px; outline: none;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; width: 22px; height: 22px;
            background: var(--primary-blue); border-radius: 50%; cursor: pointer;
        }

        .slider-labels { display: flex; justify-content: space-between; font-weight: 800; font-size: 14px; margin-top: 8px; }

        .btn-start {
            background: var(--primary-blue); color: white; border: none;
            padding: 15px; border-radius: 10px; font-weight: 800; font-size: 18px; cursor: pointer;
        }

        /* --- SCREEN 2: SOAL --- */
        #soal-screen { display: none; height: 100%; flex-direction: column; }

        .top-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .timer-container {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .timer-display {
            background: #e0e0e0;
            padding: 10px;
            border-radius: 8px;
            font-weight: 900;
            font-size: 22px;
            min-width: 60px;
            text-align: center;
        }

        .counter-display {
            background: #333;
            color: white;
            padding: 10px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 18px;
            min-width: 55px;
            text-align: center;
        }

        .instruction-blink {
            background: var(--yellow-main);
            color: #ff0000;
            padding: 10px;
            border-radius: 5px;
            font-weight: 900;
            font-size: 13px;
            flex-grow: 1;
            text-align: center;
            animation: blink 0.8s infinite;
        }

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 10px;
            text-align: center;
            overflow-y: auto; /* Memungkinkan scroll jika teks penjelasan sangat panjang */
        }

        .soal-text { font-size: 22px; font-weight: 800; margin-bottom: 20px; }

        #answer-section { display: none; width: 100%; animation: fadeIn 0.5s ease-in; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .answer-en { font-size: 20px; font-weight: 900; color: #000; margin-bottom: 5px; cursor: pointer; }

        .phonetic { font-size: 17px; font-weight: 700; margin-bottom: 10px; color: #444; }

        .explanation {
            font-size: 12px; text-align: left; background: #f1f3ff;
            padding: 15px; border-radius: 10px; border-left: 5px solid var(--primary-blue); line-height: 1.4;
            margin-bottom: 20px;
        }

        /* --- NAVIGASI --- */
        .bottom-nav {
            display: flex;
            gap: 8px;
            margin-bottom: 20px; /* Diubah sedikit agar tidak terlalu jauh ke atas di layar kecil */
        }

        .btn-action {
            background: var(--primary-blue); color: white; border: none;
            padding: 12px; border-radius: 8px; font-weight: 800; cursor: pointer;
            text-decoration: none; display: flex; align-items: center; justify-content: center;
        }

        .btn-lihat { flex: 2; font-size: 16px; }
        .nav-group { display: flex; gap: 5px; flex: 2; }
        .btn-nav { flex: 1; font-size: 13px; }
        .btn-home { background: #333; flex: 0.6; font-size: 18px; }

    </style>
</head>

        document.getElementById('counter').innerText = `${currentIndex + 1}/${daftarSoal.length}`;
        
        // Sembunyikan Jawaban
        document.getElementById('answer-section').style.display = 'none';

        // Start Timer & Suara Indo
        startTimer();
        setTimeout(suaraIndo, 500);
    }

    function startTimer() {
        updateTimerDisplay();
        timerInterval = setInterval(() => {
            waktuSisa--;
            updateTimerDisplay();
            if (waktuSisa <= 0) {
                clearInterval(timerInterval);
                tampilJawaban();
            }
        }, 1000);
    }

    function updateTimerDisplay() {
        document.getElementById('timer').innerText = waktuSisa < 10 ? '0' + waktuSisa : waktuSisa;
    }

    function tampilJawaban() {
        clearInterval(timerInterval);
        document.getElementById('answer-section').style.display = 'block';
        suaraInggris();
    }

    function nextSoal() {
        if (currentIndex < daftarSoal.length - 1) {
            currentIndex++;
            loadSoal();
        } else {
            alert("Latihan Selesai!");
        }
    }

    function prevSoal() {
        if (currentIndex > 0) {
            currentIndex--;
            loadSoal();
        }
    }

    function suaraIndo() {
        const msg = new SpeechSynthesisUtterance(daftarSoal[currentIndex].indo);
        msg.lang = 'id-ID';
        msg.volume = volumeLevel;
        window.speechSynthesis.speak(msg);
    }

    function suaraInggris() {
        const msg = new SpeechSynthesisUtterance(daftarSoal[currentIndex].eng);
        msg.lang = 'en-US';
        msg.volume = volumeLevel;
        window.speechSynthesis.speak(msg);
    }
</script>

</body>
</html>
