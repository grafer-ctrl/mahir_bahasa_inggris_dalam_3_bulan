        let currentExerciseIndex = 0;
        let timerAnswer;

        function updateVal(id, value) {
            document.getElementById(id).innerText = value;
        }

        function speak(text, lang = 'id-ID') {
            window.speechSynthesis.cancel(); 
            const speed = document.getElementById('speed-voice').value;
            const volume = document.getElementById('volume-voice').value;
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = lang;
            utterance.rate = parseFloat(speed);
            utterance.volume = parseFloat(volume);
            window.speechSynthesis.speak(utterance);
        }

        function startApp() {
            document.getElementById('intro-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('intro-screen').classList.add('hidden');
                document.getElementById('exercise-screen').classList.remove('hidden');
                loadExercise();
            }, 400);
        }

        function loadExercise() {
            const data = exercises[currentExerciseIndex];
            const delaySec = document.getElementById('speed-answer').value;

            // Update Progress UI
            const total = exercises.length;
            const current = currentExerciseIndex + 1;
            const percent = Math.round((current / total) * 100);
            
            document.getElementById('progress-text').innerText = `${current} / ${total}`;
            document.getElementById('percentage-text').innerText = `${percent}%`;
            document.getElementById('progress-bar').style.width = `${percent}%`;

            // Update Content
            document.getElementById('question-text').innerText = data.q;
            document.getElementById('ans-en').innerText = data.ans_en;
            document.getElementById('ans-id').innerText = data.ans_id;
            document.getElementById('ans-phonetic').innerText = data.ans_phonetic;

            // Reset Visibility
            document.getElementById('answer-section').classList.add('hidden');
            document.getElementById('btn-manual-show').classList.remove('hidden');

            // Speak Question
            setTimeout(() => speak(data.q, 'id-ID'), 500);

            // Auto reveal timer
            clearTimeout(timerAnswer);
            timerAnswer = setTimeout(() => {
                showAnswer();
            }, delaySec * 1000);
        }

        function showAnswer() {
            clearTimeout(timerAnswer);
            const section = document.getElementById('answer-section');
            section.classList.remove('hidden');
            section.classList.add('fade-in');
            document.getElementById('btn-manual-show').classList.add('hidden');
        }

        function playEnglishAudio() {
            const text = document.getElementById('ans-en').innerText;
            speak(text, 'en-US');
        }

        function nextExercise() {
            if (currentExerciseIndex < exercises.length - 1) {
                currentExerciseIndex++;
                loadExercise();
            } else {
                alert("Selamat! Anda telah menyelesaikan semua materi.");
                window.location.href = "index.html";
            }
        }
