<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flashcards English Mastery</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #020617;
      --card-bg: rgba(30, 41, 59, 0.7);
      --primary: #22d3ee;
      --secondary: #818cf8;
      --accent: #fbbf24;
      --text: #f8fafc;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg);
      background-image: 
        radial-gradient(at 0% 0%, rgba(34, 211, 238, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(129, 140, 248, 0.15) 0px, transparent 50%);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
    }

    .header-stats {
      margin-bottom: 20px;
    }

    .stats-label {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #94a3b8;
    }

    .progress-track {
      width: 100%;
      height: 12px;
      background: #1e293b;
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.05);
    }

    #progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .main-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 40px 30px;
      border-radius: 32px;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
      position: relative;
    }

    .word-container {
      min-height: 160px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .label-eng {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 4px;
      color: var(--primary);
      margin-bottom: 15px;
      opacity: 0.8;
    }

    .target-word {
      font-size: 40px;
      font-weight: 800;
      margin: 0;
      letter-spacing: -1px;
      background: linear-gradient(to bottom, #fff, #cbd5e1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .meaning-box {
      margin-top: 25px;
      padding: 15px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      opacity: 0;
      transform: translateY(10px);
      transition: 0.4s all ease;
    }

    .meaning-box.reveal {
      opacity: 1;
      transform: translateY(0);
    }

    .meaning-text {
      font-size: 22px;
      font-weight: 600;
      color: var(--primary);
    }

    .action-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-top: 40px;
    }

    button {
      border: none;
      border-radius: 20px;
      padding: 16px;
      font-family: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn-next {
      grid-column: span 2;
      background: var(--text);
      color: var(--bg);
      font-size: 18px;
    }

    .btn-next:hover { background: #fff; transform: translateY(-2px); }

    .btn-show {
      background: rgba(255, 255, 255, 0.1);
      color: white;
    }

    .btn-audio {
      background: var(--accent);
      color: #000;
    }

    button:active { transform: scale(0.95); }

    #congrats-view {
      display: none;
    }
  </style>
</head>
<body>

<div class="app-container">
  <div class="header-stats">
    <div class="stats-label">
      <span id="stat-count">Terjawab: 0 / 0</span>
      <span id="stat-percent">0%</span>
    </div>
    <div class="progress-track">
      <div id="progress-fill"></div>
    </div>
  </div>

  <div class="main-card">
    <div id="quiz-view">
      <div class="word-container">
        <div class="label-eng">English Word</div>
        <div class="target-word" id="word-display">Ready?</div>
        
        <div class="meaning-box" id="meaning-box">
          <div class="meaning-text" id="meaning-display">---</div>
        </div>
      </div>

      <div class="action-grid">
        <button class="btn-next" onclick="getNewWord()">Kata Berikutnya ➔</button>
        <button class="btn-show" onclick="revealAnswer()">💡 Arti</button>
        <button class="btn-audio" onclick="shoutOut()">🔊 Suara</button>
      </div>
    </div>

    <div id="congrats-view">
      <h1 style="font-size: 60px; margin: 0;">🏆</h1>
      <h2>Master!</h2>
      <p>Semua kata telah kamu pelajari dengan baik.</p>
      <button class="btn-next" onclick="resetApp()">Ulangi Sesi</button>
    </div>
  </div>
</div>

  let pool = [...wordBank];
  let currentWord = null;

  function updateProgress() {
    const total = wordBank.length;
    const answered = total - pool.length;
    const percent = Math.floor((answered / total) * 100);
    
    document.getElementById("stat-count").innerText = `Terjawab: ${answered} / ${total}`;
    document.getElementById("stat-percent").innerText = `${percent}%`;
    document.getElementById("progress-fill").style.width = `${percent}%`;
  }

  function getNewWord() {
    if (pool.length === 0) {
      document.getElementById("quiz-view").style.display = "none";
      document.getElementById("congrats-view").style.display = "block";
      return;
    }

    const idx = Math.floor(Math.random() * pool.length);
    currentWord = pool[idx];
    pool.splice(idx, 1);

    document.getElementById("word-display").innerText = currentWord.word;
    document.getElementById("meaning-box").classList.remove("reveal");
    updateProgress();
  }

  function revealAnswer() {
    if (!currentWord) return;
    document.getElementById("meaning-display").innerText = currentWord.arti;
    document.getElementById("meaning-box").classList.add("reveal");
  }

  function shoutOut() {
    if (!currentWord) return;
    const speech = new SpeechSynthesisUtterance(currentWord.word);
    speech.lang = 'en-US';
    speech.rate = 0.8;
    window.speechSynthesis.speak(speech);
  }

  function resetApp() {
    pool = [...wordBank];
    document.getElementById("quiz-view").style.display = "block";
    document.getElementById("congrats-view").style.display = "none";
    getNewWord();
  }
