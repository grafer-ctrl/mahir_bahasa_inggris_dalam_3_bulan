    <title>Pelatihan Aktif Berbicara v2.1</title>
    
    <!-- KODE PROTEKSI AKSES -->
    <script>
        if (!localStorage.getItem('premium_code')) {
            alert("Akses Ditolak! Silakan masukkan kode akses di halaman depan.");
            window.location.href = "index.html"; 
        }
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body { font-family: sans-serif; background-color: #ffffff; overflow-x: hidden; }
        .pink-btn { background-color: #e9337c; color: white; transition: all 0.2s; }
        .pink-btn:active { background-color: #c21d5f; transform: scale(0.95); }
        .blue-box { background-color: #a5c2f9; border-radius: 12px; }
        .slider-pink { 
            accent-color: #ff0066; 
            width: 100%;
            height: 12px;
        }
        .hidden-answer { display: none; }
        .fade-in { animation: fadeIn 0.4s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>

    <!-- SCREEN A: INTRO & SETTINGS -->
    <div id="screen-intro" class="max-w-md mx-auto p-6 flex flex-col items-center min-h-screen">
        <h1 class="text-3xl font-bold text-center mt-10 tracking-tight text-gray-900">PELATIHAN<br>AKTIF BERBICARA KATA GANTI</h1>
        
        <div class="blue-box p-6 mt-8 mb-8 text-center text-lg leading-tight shadow-sm text-gray-800">
            Jawab langsung secara lisan, jangan ragu.<br>Kamu pasti cepat bisa bahasa Inggris.
        </div>

        <div class="w-full space-y-6 bg-gray-50 p-5 rounded-2xl border border-gray-100">
            <div>
                <label class="block font-bold text-gray-700 mb-2 italic">Seting Volume suara</label>
                <input type="range" id="vol-setting" min="0" max="1" step="0.1" value="1" class="slider-pink">
            </div>
            <div>
                <label class="block font-bold text-gray-700 mb-2 italic">Seting kecepatan suara</label>
                <input type="range" id="rate-setting" min="0.5" max="1.5" step="0.1" value="0.9" class="slider-pink">
            </div>
            <div>
                <!-- PERBAIKAN: MAX 120 DETIK -->
                <label class="block font-bold text-gray-700 mb-2 italic">Seting lamanya kunci jawaban (detik)</label>
                <input type="range" id="timer-setting" min="1" max="120" step="1" value="10" class="slider-pink">
                <p class="text-xs text-right text-pink-600 font-bold mt-1"><span id="timer-val">10</span> Detik</p>
            </div>
        </div>

        <button onclick="startApp()" class="mt-10 flex flex-col items-center group">
            <svg class="w-20 h-20 text-red-600 drop-shadow-lg group-hover:scale-110 transition-transform" fill="currentColor" viewBox="0 0 24 24">
                <path d="M8 5v14l11-7z"/>
            </svg>
            <span class="text-2xl font-black mt-2 tracking-widest text-gray-900">MULAI</span>
        </button>
    </div>

    <!-- SCREEN B: PELATIHAN -->
    <div id="screen-quiz" class="hidden max-w-md mx-auto min-h-screen flex flex-col">
        <header class="flex items-center justify-between p-4 border-b bg-white sticky top-0 z-10">
            <a href="index.html" class="text-2xl text-gray-400 hover:text-black">
                <i class="fas fa-home"></i>
            </a>
            <h2 class="text-xl font-bold tracking-widest text-gray-800">PELATIHAN</h2>
            <div class="text-sm font-bold text-gray-400"><span id="curr-idx">1</span>/74</div>
        </header>

        <main class="flex-grow p-6 flex flex-col items-center text-center">
            <p class="text-lg font-bold mb-6 uppercase tracking-wider leading-tight text-gray-800">
                Jawab Secara Lisan<br>Sebisa Mungkin
            </p>

            <div class="blue-box w-full p-6 mb-8 flex justify-between items-center shadow-md min-h-[100px]">
                <span id="question-text" class="text-xl font-bold text-gray-800 text-left pr-4"></span>
                <button onclick="speakText('id')" class="bg-white/50 p-3 rounded-full hover:bg-white transition">
                    <i class="fas fa-volume-up text-blue-700 text-xl"></i>
                </button>
            </div>

            <p class="mb-3 font-bold text-gray-600 italic">Lihat jawaban</p>
            
            <div id="answer-container" class="w-full">
                <button id="btn-reveal" onclick="revealAnswer()" class="blue-box w-full py-5 text-white shadow-md hover:brightness-105 transition-all">
                    <i class="far fa-lightbulb text-4xl"></i>
                </button>

                <div id="answer-content" class="hidden-answer blue-box w-full p-6 text-black shadow-inner fade-in text-left">
                    <div class="flex justify-between items-start mb-2">
                        <div>
                            <p id="en-text" class="text-2xl font-black text-blue-900 leading-tight"></p>
                            <p id="ph-text" class="text-lg font-medium text-blue-700 mt-1 italic"></p>
                        </div>
                        <button onclick="speakText('en')" class="bg-white/50 p-3 rounded-full hover:bg-white transition ml-2">
                            <i class="fas fa-volume-up text-blue-800 text-xl"></i>
                        </button>
                    </div>
                    <div class="mt-4 pt-3 border-t border-blue-300">
                        <span class="bg-blue-600 text-white text-[10px] px-2 py-0.5 rounded-md font-bold uppercase">Alasan:</span>
                        <p id="reason-text" class="text-sm font-bold text-blue-900 mt-1 uppercase"></p>
                    </div>
                </div>
            </div>
        </main>

        <footer class="p-6 flex justify-between gap-4 bg-white border-t sticky bottom-0">
            <button onclick="prevQuiz()" class="pink-btn flex-1 py-3 rounded-full font-black text-lg shadow-md uppercase tracking-tighter">PREV</button>
            <button onclick="nextQuiz()" class="pink-btn flex-1 py-3 rounded-full font-black text-lg shadow-md uppercase tracking-tighter">NEXT</button>
        </footer>
    </div>

        let currentIndex = 0;
        let config = { volume: 1, rate: 0.9, delay: 10000 };
        let autoRevealTimer;

        document.getElementById('timer-setting').oninput = function() {
            document.getElementById('timer-val').innerText = this.value;
        }

        function startApp() {
            config.volume = parseFloat(document.getElementById('vol-setting').value);
            config.rate = parseFloat(document.getElementById('rate-setting').value);
            config.delay = parseInt(document.getElementById('timer-setting').value) * 1000;

            document.getElementById('screen-intro').classList.add('hidden');
            document.getElementById('screen-quiz').classList.remove('hidden');

            renderQuiz();
        }

        function renderQuiz() {
            const item = data[currentIndex];
            document.getElementById('curr-idx').innerText = currentIndex + 1;
            document.getElementById('question-text').innerText = item.id;
            document.getElementById('en-text').innerText = item.en;
            document.getElementById('ph-text').innerText = item.baca;
            document.getElementById('reason-text').innerText = item.alasan;

            document.getElementById('answer-content').classList.add('hidden-answer');
            document.getElementById('btn-reveal').classList.remove('hidden');
            
            window.speechSynthesis.cancel();
            setTimeout(() => speakText('id'), 600);

            clearTimeout(autoRevealTimer);
            autoRevealTimer = setTimeout(() => {
                revealAnswer();
            }, config.delay);
        }

        function revealAnswer() {
            clearTimeout(autoRevealTimer);
            if (!document.getElementById('answer-content').classList.contains('hidden-answer')) return;

            document.getElementById('btn-reveal').classList.add('hidden');
            document.getElementById('answer-content').classList.remove('hidden-answer');
            speakText('en');
        }

        function speakText(lang) {
            const item = data[currentIndex];
            const speech = new SpeechSynthesisUtterance();
            speech.text = (lang === 'id') ? item.id : item.en;
            speech.lang = (lang === 'id') ? 'id-ID' : 'en-US';
            speech.volume = config.volume;
            speech.rate = config.rate;
            window.speechSynthesis.speak(speech);
        }

        function nextQuiz() {
            if (currentIndex < data.length - 1) {
                currentIndex++;
                renderQuiz();
            } else {
                alert("Pelatihan Selesai!");
            }
        }

        function prevQuiz() {
            if (currentIndex > 0) {
                currentIndex--;
                renderQuiz();
            }
        }
